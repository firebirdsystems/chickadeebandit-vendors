<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendors Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: #fff;
      color: #111827;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px 8px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
    }
    .header-title { font-weight: 600; font-size: 13px; }
    .header-count {
      font-size: 11px; font-weight: 600;
      background: #111827; color: #fff;
      border-radius: 10px; padding: 1px 7px;
    }
    .header-count.zero { background: #e5e7eb; color: #6b7280; }

    .item-list { flex: 1; overflow-y: auto; }

    .item-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: #f9fafb; }

    .cat-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-contractor  { background: #3b82f6; }
    .dot-handyman    { background: #f59e0b; }
    .dot-landscaper  { background: #22c55e; }
    .dot-plumber     { background: #0ea5e9; }
    .dot-electrician { background: #eab308; }
    .dot-service     { background: #a855f7; }
    .dot-other       { background: #9ca3af; }

    .item-info { flex: 1; min-width: 0; }
    .item-name {
      font-size: 12.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-cat { font-size: 11px; color: #9ca3af; margin-top: 1px; }

    .item-stars { font-size: 11px; color: #f59e0b; flex-shrink: 0; letter-spacing: 0.5px; }
    .item-stars.none { color: #d1d5db; }

    .footer {
      padding: 6px 14px; border-top: 1px solid #e5e7eb;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; background: #f9fafb;
    }
    .open-link {
      font-size: 11px; font-weight: 600; color: #111827; text-decoration: none;
    }
    .open-link:hover { text-decoration: underline; }

    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #9ca3af; font-size: 12px; gap: 6px;
    }
  </style>
</head>
<body>
<script type="module">
const DB     = window.__DB_URL      ?? "";
const APP_ID = "vendors";

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function openApp() {
  if (window.__HUB_OPEN) window.__HUB_OPEN(APP_ID);
  else window.location.href = `/open/${APP_ID}`;
}

function catDotClass(cat) {
  const map = {
    "Contractor": "dot-contractor", "Handyman": "dot-handyman",
    "Landscaper": "dot-landscaper", "Plumber": "dot-plumber",
    "Electrician": "dot-electrician", "Service": "dot-service",
  };
  return map[cat] ?? "dot-other";
}

function starsWidget(avg, count) {
  if (!count) return `<span class="item-stars none">☆☆☆☆☆</span>`;
  const full  = Math.round(avg);
  const empty = 5 - full;
  return `<span class="item-stars">${"★".repeat(full)}${"☆".repeat(empty)}</span>`;
}

async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  return res.json();
}

async function load() {
  const [{ rows: vRows }, { rows: rRows }] = await Promise.all([
    dbq(`SELECT id, name, category FROM vendors ORDER BY created_at DESC`),
    dbq(`SELECT vendor_id, rating FROM reviews`),
  ]);

  const ratingSums   = {};
  const ratingCounts = {};
  for (const r of rRows) {
    ratingSums[r.vendor_id]   = (ratingSums[r.vendor_id]   ?? 0) + r.rating;
    ratingCounts[r.vendor_id] = (ratingCounts[r.vendor_id] ?? 0) + 1;
  }

  const sorted = [...vRows].sort((a, b) => {
    const ca = ratingCounts[a.id] ?? 0;
    const cb = ratingCounts[b.id] ?? 0;
    const ra = ca ? ratingSums[a.id] / ca : 0;
    const rb = cb ? ratingSums[b.id] / cb : 0;
    if (cb && !ca) return 1;
    if (ca && !cb) return -1;
    return rb - ra;
  }).slice(0, 5);

  const count = vRows.length;

  const header = `
    <div class="header">
      <span class="header-title">🏪 Vendors</span>
      <span class="header-count ${count === 0 ? "zero" : ""}">${count}</span>
    </div>`;

  let body;
  if (count === 0) {
    body = `<div class="empty">
      <span>No vendors yet</span>
      <a href="/open/${APP_ID}" onclick="event.preventDefault();openApp()" style="color:#111827;font-weight:600;font-size:11px">Add the first one →</a>
    </div>`;
  } else {
    body = `<div class="item-list">
      ${sorted.map(v => {
        const cnt = ratingCounts[v.id] ?? 0;
        const avg = cnt ? ratingSums[v.id] / cnt : 0;
        return `<div class="item-row" onclick="openApp()">
          <div class="cat-dot ${catDotClass(v.category)}"></div>
          <div class="item-info">
            <div class="item-name">${esc(v.name)}</div>
            <div class="item-cat">${esc(v.category)}</div>
          </div>
          ${starsWidget(avg, cnt)}
        </div>`;
      }).join("")}
    </div>`;
  }

  const footer = `
    <div class="footer">
      <a class="open-link" href="/open/${APP_ID}" onclick="event.preventDefault();openApp()">All vendors →</a>
    </div>`;

  document.body.innerHTML = header + body + footer;
}

load().catch(() => {
  document.body.innerHTML = `<div class="empty"><a href="/open/${APP_ID}" onclick="event.preventDefault();openApp()" style="color:#111827;font-weight:600">Open Vendors →</a></div>`;
});
</script>
</body>
</html>
